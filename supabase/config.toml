# Configuração do Supabase CLI deste projeto.
#
# project_id é a referência do projeto Supabase usado por `supabase link` e `supabase db push`.
# Troque pelo "Project ref" do SEU projeto (painel do Supabase > Project Settings > General).
project_id = "troque-pelo-project-ref"

# Autenticação. O app envia `emailRedirectTo = <origem>/auth` no cadastro e no reenvio da
# confirmação, e `redirectTo = <origem>/reset-password` na recuperação de senha. Uma URL que não
# estiver na lista abaixo é trocada pelo site_url, e o link do e-mail leva ao lugar errado.
#
# ATENÇÃO: `supabase config push` grava estas configurações no projeto REMOTO, e chaves de [auth] que
# não estão aqui podem voltar ao padrão da CLI. Revise o diff que o comando mostra antes de confirmar.
# Troque o endereço abaixo (exemplo) pelo do site publicado (Cloudflare Workers ou domínio próprio) e inclua as
# URLs /auth e /reset-password dele antes de rodar o comando.
[auth]
site_url = "https://familygym.exemplo.workers.dev"
additional_redirect_urls = [
  "https://familygym.exemplo.workers.dev/auth",
  "https://familygym.exemplo.workers.dev/reset-password",
  # Desenvolvimento local: `bun run dev` sobe na porta 8080 (padrão do projeto); 5173 é a porta
  # padrão do Vite, para quem sobe com `--port 5173`.
  "http://localhost:8080/auth",
  "http://localhost:8080/reset-password",
  "http://localhost:5173/auth",
  "http://localhost:5173/reset-password",
]

[auth.email]
enable_signup = true
# O app mostra "enviamos um link de confirmação" após o cadastro e só deixa entrar com e-mail
# confirmado; os vínculos de aluno e o bootstrap do primeiro staff também exigem e-mail confirmado.
enable_confirmations = true

# Verificação em duas etapas (aplicativo autenticador). A tela Segurança do app cadastra
# (mfa.enroll) e confirma (mfa.challengeAndVerify) fatores TOTP; no padrão da CLI as duas etapas
# vêm desligadas.
# SMTP próprio. O e-mail padrão do Supabase só entrega a membros da equipe do projeto e limita a cerca
# de 2 por hora: sem isto, clientes não recebem a confirmação de cadastro. Descomente, defina
# SMTP_HOST/SMTP_USER/SMTP_PASS/SMTP_FROM no ambiente de quem roda `supabase config push` e veja
# docs/configuracao-de-producao.md. No painel: Authentication > Emails > SMTP Settings.
# [auth.email.smtp]
# enabled = true
# host = "env(SMTP_HOST)"
# port = 587
# user = "env(SMTP_USER)"
# pass = "env(SMTP_PASS)"
# admin_email = "env(SMTP_FROM)"
# sender_name = "Academia Family Gym"

[auth.mfa.totp]
enroll_enabled = true
verify_enabled = true
